<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="K-SAKI">
  <!-- K-SAKI logo: huruf K besar yang menyatu dengan petir, plus sayap gerak -->
  <!-- Warna mengikuti currentColor agar cocok di mode malam maupun siang -->
  <g fill="currentColor">
    <!-- Huruf K tebal -->
    <path d="M22 10 H40 V58 L82 10 H100 L62 60 L104 110 H84 L40 68 V110 H22 Z"/>
    <!-- Petir di samping K, hampir menyentuh ujung lengan atas K -->
    <path d="M126 8 L106 54 h12 L110 102 L142 46 h-14 L148 8 Z"/>
  </g>
  <!-- Sayap: tiga garis sapuan ke kanan -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M156 30 Q184 22 212 32"/>
    <path d="M156 60 Q188 54 216 66"/>
    <path d="M156 90 Q184 88 208 98"/>
  </g>
</svg>
